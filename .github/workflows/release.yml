name: Release

# Tag a version and this builds it, signs it, has Apple notarise it, and hangs
# the result off a draft release for you to look at before anyone else does.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The secrets it needs are listed in docs/RELEASING.md. Without them the build
# still runs and produces an unsigned app, which macOS will refuse to open on
# any machine but the one that built it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build, sign and notarise
    runs-on: macos-latest
    permissions:
      # tauri-action creates the release and uploads to it.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both, because the bundle is universal.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # A release should not be the first place a failure turns up.
      - run: pnpm typecheck
      - run: pnpm test

      # Notarisation wants the key as a file, so the secret becomes one.
      - name: Write the App Store Connect key
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing. tauri-action imports the certificate into a temporary
          # keychain of its own and throws it away afterwards.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation, by App Store Connect key rather than an Apple ID and
          # an app specific password, because a key does not expire.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey.p8
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: PaperV2 ${{ github.ref_name }}
          releaseBody: |
            A minimal WYSIWYG Markdown editor for the desktop.

            Requires macOS 13 or newer. Universal: Apple silicon and Intel.
          # Draft, so a bad build is never a published one.
          releaseDraft: true
          prerelease: false
