name: Release

# Tag a version and this builds it, signs it, has Apple notarise it, and hangs
# the result off a draft release for you to look at before anyone else does.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The secrets it needs are listed in docs/RELEASING.md. Without them the build
# still runs and produces an unsigned app, which macOS will refuse to open on
# any machine but the one that built it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build, sign and notarise
    runs-on: macos-latest
    permissions:
      # tauri-action creates the release and uploads to it.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both, because the bundle is universal.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # A release should not be the first place a failure turns up.
      - run: pnpm typecheck
      - run: pnpm test

      # Notarisation wants the key as a file, so the secret becomes one.
      - name: Write the App Store Connect key
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing. tauri-action imports the certificate into a temporary
          # keychain of its own and throws it away afterwards.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation, by App Store Connect key rather than an Apple ID and
          # an app specific password, because a key does not expire.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey.p8
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Paper ${{ github.ref_name }}
          releaseBody: |
            A minimal WYSIWYG Markdown editor for the desktop.

            Requires macOS 13 or newer. Universal: Apple silicon and Intel.
          # Draft, so a bad build is never a published one.
          releaseDraft: true
          prerelease: false

      # Two things happen here, both after tauri-action rather than inside it.
      #
      # Tauri notarises the .app and staples it, then builds the .dmg around the
      # result and only signs that. So the application is fine once it is out of
      # the disk image, but the disk image is the part a person double clicks
      # first, and without a ticket of its own it is refused with "Apple cannot
      # check it for malicious software". So the container is notarised too.
      #
      # And the bundle is named Paper_<version>_universal.dmg, which cannot be
      # linked to: a download button on the website would break on every
      # release. Renaming it to Paper.dmg makes
      # /releases/latest/download/Paper.dmg a permanent address. The version is
      # not lost by dropping it from the file name; it is in the bundle, and the
      # About panel reads it from there.
      - name: Notarise, staple and publish the disk image
        if: env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILT=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
                    -name "*.dmg" -print -quit)
          DMG="$(dirname "$BUILT")/Paper.dmg"
          mv "$BUILT" "$DMG"
          echo "Notarising $DMG (built as $(basename "$BUILT"))"

          xcrun notarytool submit "$DMG" \
            --key ~/private_keys/AuthKey.p8 \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # Proves the ticket is really attached, rather than trusting the exit
          # code of the step above.
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

          gh release upload "${{ github.ref_name }}" "$DMG" \
            --repo "${{ github.repository }}" --clobber

          # tauri-action already uploaded the versioned name. Leaving it would
          # put two identical disk images on the release, one of them unstapled.
          gh release delete-asset "${{ github.ref_name }}" "$(basename "$BUILT")" \
            --repo "${{ github.repository }}" --yes || true
